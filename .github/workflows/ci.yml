name: Volatility Drag & Macro Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R (for cross-validation)
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-readr r-cran-dplyr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest test suite
        run: python -m pytest

      - name: Run end-to-end empirical & simulation verification workflow
        run: python -m src.pipeline_workflow --no-cache

      - name: Print generated verification report
        run: cat outputs/blog_verification_summary.md

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volatility-verification-outputs
          path: |
            outputs/blog_verification_summary.md
            outputs/volatility_drag_r_summary.txt
            outputs/chart_volatility_drag_profile.png
            outputs/chart_event_slippage_divergence.png
            data/event_volatility_panel.csv
            data/historical_etf_empirical_panel.csv
